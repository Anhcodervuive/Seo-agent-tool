<div class="admin-sidebar">
    <div class="admin-sidebar-title">Admin Console</div>
    <nav class="admin-sidebar-nav" aria-label="Admin Navigation">
        <a href="{{ url_for('admin.settings') }}" class="admin-sidebar-link {% if request.endpoint == 'admin.settings' %}is-active{% endif %}" {% if request.endpoint == 'admin.settings' %}aria-current="page"{% endif %}>
            <span class="admin-sidebar-link-content">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/>
                    <circle cx="12" cy="12" r="4"/>
                </svg>
                <span>AI Settings</span>
            </span>
            <span class="admin-sidebar-badge">Active</span>
        </a>

        <a href="{{ url_for('admin.google_accounts') }}" class="admin-sidebar-link {% if request.endpoint == 'admin.google_accounts' %}is-active{% endif %}" {% if request.endpoint == 'admin.google_accounts' %}aria-current="page"{% endif %}>
            <span class="admin-sidebar-link-content">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
                <span>Google Accounts</span>
            </span>
            <span class="admin-sidebar-badge">{{ admin_google_accounts_count or 0 }}</span>
        </a>

        <a href="{{ url_for('admin.users') }}" class="admin-sidebar-link {% if request.endpoint in ['admin.users', 'admin.assign_projects'] %}is-active{% endif %}" {% if request.endpoint in ['admin.users', 'admin.assign_projects'] %}aria-current="page"{% endif %}>
            <span class="admin-sidebar-link-content">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Team & Access</span>
            </span>
            <span class="admin-sidebar-badge">{{ admin_users_count or 0 }}</span>
        </a>
    </nav>
</div>
