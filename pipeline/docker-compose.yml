services:
  migrate:
    build: .
    # Run schema upgrades once before either long-running application process
    # starts.  This prevents a freshly deployed worker from querying a model
    # whose migration is still being applied by the web container.
    container_name: seo_agent_migrate
    restart: "no"
    command: ["python", "-m", "flask", "--app", "manage.py", "db", "upgrade"]
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - SQLALCHEMY_DATABASE_URI=postgresql://seo_user:seo_password@db:5432/seo_agent
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: seo_agent_web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - SQLALCHEMY_DATABASE_URI=postgresql://seo_user:seo_password@db:5432/seo_agent
      # LibreCrawl runs on the Docker host. 127.0.0.1 inside a container
      # points back to that container, not to the host process.
      - LIBRECRAWL_URL=http://host.docker.internal:5080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Keep generated reports available to Flask processes started from VS Code
      # and preserve them when the web/worker containers are recreated.
      - ./reports:/app/reports
      - ./app/static/reports:/app/app/static/reports
      - ./secure/google_accounts:/app/secure/google_accounts
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  worker:
    build: .
    container_name: seo_agent_worker
    restart: always
    command: ["python", "-u", "-m", "services.audit_worker"]
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - SQLALCHEMY_DATABASE_URI=postgresql://seo_user:seo_password@db:5432/seo_agent
      # Keep the worker pointed at the host crawler even when .env is used
      # by a Flask process started directly from VS Code.
      - LIBRECRAWL_URL=http://host.docker.internal:5080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Worker-generated reports must use the same persistent host directory
      # that the web application reads.
      - ./reports:/app/reports
      - ./app/static/reports:/app/app/static/reports
      - ./secure/google_accounts:/app/secure/google_accounts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  db:
    image: postgres:15-alpine
    container_name: seo_agent_db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_password
      POSTGRES_DB: seo_agent
    volumes:
      - seo_agent_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d seo_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgweb:
    image: sosedoff/pgweb
    container_name: seo_agent_pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://seo_user:seo_password@db:5432/seo_agent?sslmode=disable
    depends_on:
      - db

volumes:
  seo_agent_pgdata_v2:
