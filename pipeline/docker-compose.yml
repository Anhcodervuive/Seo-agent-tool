version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: seo_agent_db
    environment:
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_password
      POSTGRES_DB: seo_agent
    ports:
      - "5433:5432"
    volumes:
      - seo_agent_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  seo_agent_pgdata:
